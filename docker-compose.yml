services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-findora}
      POSTGRES_USER: ${POSTGRES_USER:-findora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findora_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes: [findora_db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-findora}:${POSTGRES_PASSWORD:-findora_local_only}@db:5432/${POSTGRES_DB:-findora}
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-before-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
    volumes: [findora_uploads:/app/uploads]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  findora_db:
  findora_uploads:
